[agent]
  interval = "15s"
  omit_hostname = true
[[inputs.http_response]]
  urls = ["${HEALTH_URL}"]
  response_timeout = "5s"
  # Loopback only. PF/PA currently use stock self-signed listener certificates.
  insecure_skip_verify = true
[[inputs.internal]]
  collect_memstats = false
[[inputs.statsd]]
  service_address = "127.0.0.1:8125"
  metric_separator = "_"
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  tls_cert = "/tls/tls.crt"
  tls_key = "/tls/tls.key"
