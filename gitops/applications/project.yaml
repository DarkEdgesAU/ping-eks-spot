apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ping-workloads
  namespace: argocd
spec:
  description: Manual Ping workload deployments; runtime routing and secrets are operator-owned
  sourceRepos:
  - https://github.com/darkedges/pingdirectory-eks-spot.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: identity-blue
  - server: https://kubernetes.default.svc
    namespace: identity-federate
  - server: https://kubernetes.default.svc
    namespace: identity-green
  - server: https://kubernetes.default.svc
    namespace: identity-proxy
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: policy
    kind: PodDisruptionBudget
  - group: networking.k8s.io
    kind: Ingress
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
