apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pingcentral
  namespace: argocd
spec:
  project: pingcentral
  source:
    repoURL: https://github.com/DarkEdgesAU/ping-eks-spot.git
    targetRevision: main
    path: gitops/workloads/pingcentral
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: identity-central
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true
