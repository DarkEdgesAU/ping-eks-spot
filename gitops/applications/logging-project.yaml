apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: OpenSearch log-shipping POC
  sourceRepos:
  - https://github.com/DarkEdgesAU/pingdirectory-eks-spot.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: logging
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: policy
    kind: PodDisruptionBudget
  - group: networking.k8s.io
    kind: Ingress
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: apps
    kind: DaemonSet
  - group: batch
    kind: Job
