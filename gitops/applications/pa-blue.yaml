apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pa-blue
  namespace: argocd
spec:
  project: ping-workloads
  source:
    repoURL: https://github.com/DarkEdgesAU/ping-eks-spot.git
    targetRevision: main
    path: gitops/workloads/pa-blue
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: identity-access-blue
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/replicas
