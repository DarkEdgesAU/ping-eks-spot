apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pd-green
  namespace: argocd
spec:
  project: ping-workloads
  source:
    repoURL: https://github.com/darkedges/pingdirectory-eks-spot.git
    targetRevision: feature/pingfederate
    path: gitops/workloads/pd-green
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: identity-green
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/replicas
