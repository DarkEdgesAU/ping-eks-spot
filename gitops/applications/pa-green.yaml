apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pa-green
  namespace: argocd
spec:
  project: ping-workloads
  source:
    repoURL: https://github.com/darkedges/pingdirectory-eks-spot.git
    targetRevision: feature/pingfederate
    path: gitops/workloads/pa-green
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: identity-access-green
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/replicas
