apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics
  namespace: argocd
spec:
  project: metrics
  source:
    repoURL: https://github.com/darkedges/pingdirectory-eks-spot.git
    targetRevision: main
    path: gitops/workloads/metrics
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true
