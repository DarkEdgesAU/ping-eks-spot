apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-config
  namespace: monitoring
data:
  prometheus.yml: "alerting:\n  alertmanagers:\n  - static_configs:\n    - targets:\n\
    \      - alertmanager:9093\nglobal:\n  evaluation_interval: 15s\n  scrape_interval:\
    \ 15s\nrule_files:\n- /settings/alerts.yml\nscrape_configs:\n- job_name: prometheus\n\
    \  static_configs:\n  - targets:\n    - localhost:9090\n- job_name: ping-pods\n\
    \  kubernetes_sd_configs:\n  - namespaces:\n      names:\n      - identity-blue\n\
    \      - identity-green\n      - identity-proxy\n      - identity-federate-blue\n\
    \      - identity-federate-green\n      - identity-access-blue\n      - identity-access-green\n\
    \    role: pod\n  relabel_configs:\n  - action: keep\n    regex: ping-metrics\n\
    \    source_labels:\n    - __meta_kubernetes_pod_container_port_name\n  - action:\
    \ keep\n    regex: Running\n    source_labels:\n    - __meta_kubernetes_pod_phase\n\
    \  - source_labels:\n    - __meta_kubernetes_namespace\n    target_label: namespace\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n\
    \  scheme: https\n  tls_config:\n    ca_file: /tls/ca.crt\n    server_name: ping-metrics\n"
  alerts.yml: "groups:\n- name: ping-poc\n  rules:\n  - alert: PingExporterDown\n\
    \    annotations:\n      summary: Ping metrics exporter is unreachable\n    expr:\
    \ up{job=\"ping-pods\"} == 0\n    for: 2m\n    labels:\n      severity: warning\n\
    \  - alert: PingHealthFailed\n    annotations:\n      summary: Ping listener health\
    \ check failed\n    expr: http_response_result_code{job=\"ping-pods\"} != 0 or\
    \ http_response_http_response_code{job=\"ping-pods\"}\n      >= 400\n    for:\
    \ 2m\n    labels:\n      severity: warning\n  - alert: PingHealthSlow\n    annotations:\n\
    \      summary: Ping listener health check exceeds one second\n    expr: http_response_response_time{job=\"\
    ping-pods\"} > 1\n    for: 2m\n    labels:\n      severity: warning\n  - alert:\
    \ PingTargetsMissing\n    annotations:\n      summary: No Ping metrics targets\
    \ discovered\n    expr: absent(up{job=\"ping-pods\"})\n    for: 2m\n    labels:\n\
    \      severity: warning\n  - alert: PingTargetCountLow\n    annotations:\n  \
    \    summary: Expected 25 Ping pods with metrics exporters\n    expr: count(up{job=\"\
    ping-pods\"}) < 25\n    for: 2m\n    labels:\n      severity: warning\n"
  alertmanager.yml: "receivers:\n- name: local-only\nroute:\n  group_by:\n  - alertname\n\
    \  - namespace\n  receiver: local-only\n"
  datasources.yml: "apiVersion: 1\ndatasources:\n- access: proxy\n  editable: false\n\
    \  isDefault: true\n  name: Prometheus\n  type: prometheus\n  uid: prometheus\n\
    \  url: http://prometheus:9090\n"
  dashboards.yml: "apiVersion: 1\nproviders:\n- name: ping\n  options:\n    path:\
    \ /dashboards\n"
  ping.json: '{"uid": "ping-poc", "title": "Ping platform POC", "schemaVersion": 39,
    "version": 1, "refresh": "15s", "time": {"from": "now-1h", "to": "now"}, "panels":
    [{"id": 1, "title": "Exporters up by namespace", "type": "timeseries", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w":
    12, "h": 8}, "targets": [{"expr": "sum by(namespace) (up{job=\"ping-pods\"})",
    "legendFormat": "{{namespace}} {{pod}}"}]}, {"id": 2, "title": "Health response
    time", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "http_response_response_time{job=\"ping-pods\"}",
    "legendFormat": "{{namespace}} {{pod}}"}]}, {"id": 3, "title": "Health HTTP status",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "http_response_http_response_code{job=\"ping-pods\"}",
    "legendFormat": "{{namespace}} {{pod}}"}]}, {"id": 4, "title": "Firing alerts",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "ALERTS{alertstate=\"firing\"}",
    "legendFormat": "{{namespace}} {{pod}}"}]}]}'
---
