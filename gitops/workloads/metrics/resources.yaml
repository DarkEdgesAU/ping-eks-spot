apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 0
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65534
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: prometheus
        image: prom/prometheus:v3.7.2
        args:
        - --config.file=/settings/prometheus.yml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=1d
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: settings
          mountPath: /settings
        - name: data
          mountPath: /data
        - name: tls
          mountPath: /tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
      volumes:
      - name: settings
        configMap:
          name: metrics-config
      - name: tls
        secret:
          secretName: metrics-tls
      serviceAccountName: prometheus
  serviceName: prometheus
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: pingdirectory-ebs
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
  - name: https
    port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 0
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.28.1
        args:
        - --config.file=/settings/alertmanager.yml
        - --storage.path=/data
        - --cluster.listen-address=
        ports:
        - containerPort: 9093
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: settings
          mountPath: /settings
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
      volumes:
      - name: settings
        configMap:
          name: metrics-config
  serviceName: alertmanager
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: pingdirectory-ebs
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
  - name: https
    port: 9093
    targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 0
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: grafana
        image: grafana/grafana:12.2.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SERVER_PROTOCOL
          value: https
        - name: GF_SERVER_CERT_FILE
          value: /tls/tls.crt
        - name: GF_SERVER_CERT_KEY
          value: /tls/tls.key
        - name: GF_SERVER_ROOT_URL
          value: https://monitoring.eks.darkedges.com
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_SECURITY_ADMIN_PASSWORD__FILE
          value: /auth/admin-password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: auth
          mountPath: /auth
          readOnly: true
        - name: settings
          mountPath: /etc/grafana/provisioning/datasources/ping.yml
          subPath: datasources.yml
        - name: settings
          mountPath: /etc/grafana/provisioning/dashboards/ping.yml
          subPath: dashboards.yml
        - name: settings
          mountPath: /dashboards/ping.json
          subPath: ping.json
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTPS
      volumes:
      - name: settings
        configMap:
          name: metrics-config
      - name: tls
        secret:
          secretName: metrics-tls
      - name: auth
        secret:
          secretName: grafana-auth
  serviceName: grafana
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: pingdirectory-ebs
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - name: https
    port: 3000
    targetPort: 3000
