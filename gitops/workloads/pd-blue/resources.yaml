  SECRETS_DIR: /run/ping-secrets
  SERVER_PROFILE_URL: ''
  TRUSTSTORE_FILE: /run/ping-secrets/truststore.p12
  TRUSTSTORE_PIN_FILE: /run/ping-secrets/truststore.pin
