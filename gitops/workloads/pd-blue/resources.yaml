kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: pd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pingdirectory
    helm.sh/chart: ping-devops-0.16.0
  name: pd-pingdirectory-env-vars
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: 'true'
  labels:
    app.kubernetes.io/instance: pd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pingdirectory
    helm.sh/chart: ping-devops-0.16.0
  name: pd-pingdirectory-cluster
spec:
  clusterIP: None
  ports:
  - name: ldaps
    port: 1636
    protocol: TCP
  publishNotReadyAddresses: true
  selector:
    clusterIdentifier: pd-pingdirectory
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations: null
  labels:
    app.kubernetes.io/instance: pd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pingdirectory
    helm.sh/chart: ping-devops-0.16.0
  name: pd-pingdirectory
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 1443
  - name: ldap
    port: 389
    protocol: TCP
    targetPort: 1389
  - name: ldaps
    port: 636
    protocol: TCP
    targetPort: 1636
  selector:
    app.kubernetes.io/instance: pd
    app.kubernetes.io/name: pingdirectory
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/instance: pd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pingdirectory
    helm.sh/chart: ping-devops-0.16.0
  name: pd-pingdirectory
  namespace: identity-blue
spec:
  podManagementPolicy: OrderedReady
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: pd
      app.kubernetes.io/name: pingdirectory
  serviceName: pd-pingdirectory-cluster
  template:
    metadata:
      annotations:
        checksum/config: 82c85431e95a1edac60e1b1b77f8743c6c48a43d32be2e0ce2365380b3eca609
      labels:
        app.kubernetes.io/instance: pd
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: pingdirectory
        clusterIdentifier: pd-pingdirectory
        helm.sh/chart: ping-devops-0.16.0
    spec:
      affinity: {}
      containers:
      - args: null
        envFrom:
        - configMapRef:
            name: pd-global-env-vars
            optional: true
        - configMapRef:
            name: pd-env-vars
            optional: true
        - configMapRef:
            name: pd-pingdirectory-env-vars
        - secretRef:
            name: devops-secret
            optional: true
        - secretRef:
            name: pd-pingdirectory-git-secret
            optional: true
        image: 447061058131.dkr.ecr.ap-southeast-2.amazonaws.com/pd-spot-dev/pingdirectory:dev-v3
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        livenessProbe:
          exec:
            command:
            - /opt/liveness.sh
          failureThreshold: 4
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: pingdirectory
        ports:
        - containerPort: 1443
          name: https
        - containerPort: 1389
          name: ldap
        - containerPort: 1636
          name: ldaps
        - containerPort: 8989
          name: replication
        readinessProbe:
          exec:
            command:
            - /opt/readiness.sh
          failureThreshold: 4
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2
            memory: 8Gi
          requests:
            cpu: 1500m
            memory: 6Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - /opt/liveness.sh
          failureThreshold: 180
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /runtime
          name: runtime-zone
        - mountPath: /run/ping-secrets
          name: runtime-secret-files
          readOnly: true
        - mountPath: /opt/out
          name: out-dir
      - name: log-shipper
        image: fluent/fluent-bit:4.2.3
        args:
        - -c
        - /fluent-bit/etc/poc/sidecar.conf
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 192Mi
        securityContext:
          runAsUser: 9031
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PRODUCT
          value: pingdirectory
        - name: LOG_PATHS
          value: /logs/instance/logs/*
        - name: COLOUR
          value: blue
        - name: LOG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: log-shipper
              key: password
        volumeMounts:
        - name: out-dir
          mountPath: /logs
          readOnly: true
        - name: logging-config
          mountPath: /fluent-bit/etc/poc
          readOnly: true
        - name: logging-credentials
          mountPath: /credentials
          readOnly: true
        - name: logging-buffer
          mountPath: /buffers
      enableServiceLinks: true
      initContainers:
      - args:
        - "#!/usr/bin/env sh\n# Runs only as an init container, before any directory\
          \ process opens this PVC.\nset -eu\numask 077\nsource_dir=${SECRET_SOURCE:-/run/projected-secrets}\n\
          destination=${SECRET_DEST:-/run/ping-secrets}\nconfig=${SERVER_CONFIG:-/opt/out/instance/config/config.ldif}\n\
          mkdir -p \"$destination\"\nfor source in \"$source_dir\"/*; do\n    test\
          \ -f \"$source\" || continue\n    cp -L \"$source\" \"$destination/$(basename\
          \ \"$source\")\"\n    chmod 640 \"$destination/$(basename \"$source\")\"\
          \ndone\ntest -s \"$destination/keystore.p12\"\ntest -s \"$destination/truststore.p12\"\
          \nif test -f \"$config\"; then\n    # Unfold LDIF before matching paths,\
          \ since Ping may wrap long attribute lines.\n    temporary=\"${config}.secret-path-repair.tmp\"\
          \n    trap 'rm -f \"$temporary\"' EXIT HUP INT TERM\n    awk '\n    function\
          \ emit() {\n        if (line ~ /^ds-cfg-(key|trust)-store-(file|pin-file):\
          \ /) {\n            gsub(/\\/run\\/ping-secrets\\/\\.\\.[0-9][0-9][0-9][0-9]_[^\\\
          /[:space:]]+\\//, \"/run/ping-secrets/\", line)\n        }\n        print\
          \ line\n    }\n    /^ / { line = line substr($0, 2); next }\n    { if (NR\
          \ > 1) emit(); line = $0 }\n    END { if (NR > 0) emit() }\n    ' \"$config\"\
          \ > \"$temporary\"\n    # Only replace configuration when an expired projected\
          \ path was present.\n    if grep -Eq '^ds-cfg-(key|trust)-store-(file|pin-file):\
          \ /run/ping-secrets/\\.\\.' \"$temporary\"; then\n        echo 'Unsupported\
          \ projected Secret path remains; refusing startup' >&2\n        exit 1\n\
          \    fi\n    if ! cmp -s \"$config\" \"$temporary\"; then\n        cp -p\
          \ \"$config\" \"${config}.before-secret-path-repair.$(date +%s)\"\n    \
          \    chmod 600 \"$temporary\"\n        mv \"$temporary\" \"$config\"\n \
          \       echo 'Normalized saved TLS paths; original configuration preserved\
          \ on PVC'\n    fi\nfi\n"
        command:
        - sh
        - -ec
        image: pingidentity/pingtoolkit:2609
        name: prepare-runtime
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 9031
        volumeMounts:
        - mountPath: /run/projected-secrets
          name: runtime-secrets
          readOnly: true
        - mountPath: /run/ping-secrets
          name: runtime-secret-files
        - mountPath: /opt/out
          name: out-dir
      - args:
        - zone=$(kubectl get node "$NODE_NAME" -o jsonpath='{.metadata.labels.topology\.kubernetes\.io/zone}');
          test -n "$zone"; printf "%s" "$zone" > /runtime/availability-zone
        command:
        - sh
        - -ec
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: pingidentity/pingtoolkit:2609
        name: read-availability-zone
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 9031
        volumeMounts:
        - mountPath: /runtime
          name: runtime-zone
      nodeSelector:
        eks.amazonaws.com/capacityType: SPOT
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 9031
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ping-runtime
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 300
      tolerations: []
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: pd
            app.kubernetes.io/name: pingdirectory
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: pd
            app.kubernetes.io/name: pingdirectory
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - emptyDir: {}
        name: runtime-zone
      - name: runtime-secrets
        secret:
          secretName: pd-runtime
      - emptyDir:
          medium: Memory
        name: runtime-secret-files
      - name: out-dir
        persistentVolumeClaim:
          claimName: out-dir
      - name: logging-config
        configMap:
          name: ping-log-collector
      - name: logging-credentials
        secret:
          secretName: log-shipper
      - name: logging-buffer
        emptyDir:
          sizeLimit: 256Mi
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      annotations: {}
      name: out-dir
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
      storageClassName: pingdirectory-ebs
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ping-log-collector
  namespace: identity-blue
data:
  sidecar.conf: "[SERVICE]\n    Flush 2\n    Log_Level info\n    Parsers_File /fluent-bit/etc/poc/parsers.conf\n\
    \    storage.path /buffers/chunks\n    HTTP_Server On\n    HTTP_Listen 0.0.0.0\n\
    \    HTTP_Port 2020\n\n[INPUT]\n    Name tail\n    Path ${LOG_PATHS}\n    Exclude_Path\
    \ *.gz,*.zip,*.lock,*.lck\n    Tag ping.files\n    Path_Key source_file\n    DB\
    \ /buffers/tail.db\n    Read_from_Head On\n    Refresh_Interval 2\n    Rotate_Wait\
    \ 10\n    Buffer_Max_Size 1M\n    Skip_Long_Lines On\n    storage.type filesystem\n\
    \n[FILTER]\n    Name modify\n    Match *\n    Add namespace ${POD_NAMESPACE}\n\
    \    Add pod ${POD_NAME}\n    Add product ${PRODUCT}\n    Add colour ${COLOUR}\n\
    \    Add stream product_file\n\n[OUTPUT]\n    Name opensearch\n    Match *\n \
    \   Host opensearch.logging.svc.cluster.local\n    Port 9200\n    HTTP_User logshipper\n\
    \    HTTP_Passwd ${LOG_PASSWORD}\n    tls On\n    tls.verify On\n    tls.verify_hostname\
    \ On\n    tls.ca_file /credentials/ca.crt\n    Logstash_Format On\n    Logstash_Prefix\
    \ logs-ping\n    Suppress_Type_Name On\n    Generate_ID On\n    Retry_Limit False\n\
    \    storage.total_limit_size 128M\n"
  parsers.conf: "[PARSER]\n    Name cri\n    Format regex\n    Regex ^(?<time>[^ ]+)\
    \ (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$\n    Time_Key time\n \
    \   Time_Format %Y-%m-%dT%H:%M:%S.%L%z\n\n[PARSER]\n    Name kube_path\n    Format\
    \ regex\n    Regex ^/var/log/containers/(?<pod>[^_]+)_(?<namespace>[^_]+)_(?<container>.+)-(?<container_id>[a-f0-9]+)\\\
    .log$\n"
