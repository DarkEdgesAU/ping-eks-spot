---
apiVersion: v1
data:
  BASE_ATTRIBUTE: dc
  BASE_CLASS: domain
  BASE_VALUE: example
  HTTPS_PORT: '1443'
  K8S_CLUSTER: blue
  K8S_CLUSTERS: blue green
  K8S_NUM_REPLICAS: '3'
  K8S_POD_HOSTNAME_PREFIX: pd-pingdirectory-
  K8S_POD_HOSTNAME_SUFFIX: .pd-pingdirectory-cluster.identity-blue.svc.cluster.local
  K8S_SEED_CLUSTER: blue
  K8S_SEED_HOSTNAME_PREFIX: pd-pingdirectory-
  K8S_SEED_HOSTNAME_SUFFIX: .pd-pingdirectory-cluster.identity-blue.svc.cluster.local
  K8S_STATEFUL_SET_NAME: pd-pingdirectory
  K8S_STATEFUL_SET_SERVICE_NAME: pd-pingdirectory-cluster
  KEYSTORE_FILE: /run/ping-secrets/keystore.p12
  KEYSTORE_PIN_FILE: /run/ping-secrets/keystore.pin
  LDAP_PORT: '1389'
  LDAPS_PORT: '1636'
  LICENSE_DIR: /run/ping-secrets
  MAKELDIF_USERS: '20000'
  MAX_HEAP_SIZE: 4g
  ORCHESTRATION_TYPE: KUBERNETES
  PA_ENGINE_PUBLIC_HOSTNAME: access.eks.darkedges.com
  PD_DELEGATOR_PUBLIC_HOSTNAME: ext-pingdelegator.eks.darkedges.com
  PD_DELEGATOR_PUBLIC_PORT_HTTPS: '443'
  PD_LICENSE_DIR: /run/ping-secrets
  PF_ENGINE_PUBLIC_HOSTNAME: id.eks.darkedges.com
  PF_ENGINE_PUBLIC_PORT_HTTPS: '443'
  PING_IDENTITY_ACCEPT_EULA: 'YES'
