spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: pf-blue
      app.kubernetes.io/name: pingfederate-engine
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: e204d9bfe06e660375100c0654ce009f3981bac9d9180a9e9e0ae1315c3ad9c9
      labels:
        app.kubernetes.io/instance: pf-blue
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: pingfederate-engine
        clusterIdentifier: pf-blue-pingfederate
        helm.sh/chart: ping-devops-0.16.0
    spec:
      affinity: {}
      containers:
      - args: null
        envFrom:
        - configMapRef:
            name: pf-blue-global-env-vars
            optional: true
        - configMapRef:
            name: pf-blue-env-vars
            optional: true
        - configMapRef:
            name: pf-blue-pingfederate-engine-env-vars
        - secretRef:
            name: devops-secret
            optional: true
        - secretRef:
            name: pf-blue-pingfederate-engine-git-secret
            optional: true
        image: 447061058131.dkr.ecr.ap-southeast-2.amazonaws.com/pd-spot-dev/pingfederate:pf-v1
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        livenessProbe:
          exec:
            command:
            - /opt/liveness.sh
          failureThreshold: 4
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: pingfederate-engine
        ports:
        - containerPort: 7600
          name: clusterbind
        - containerPort: 7700
          name: clusterfail
        - containerPort: 9031
          name: https
        readinessProbe:
          exec:
            command:
            - /opt/readiness.sh
          failureThreshold: 4
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - /opt/liveness.sh
          failureThreshold: 90
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /run/ping-secrets
          name: pf-secrets
          readOnly: true
      enableServiceLinks: true
      initContainers:
      - command:
        - sh
        - -c
        - echo "Waiting for pf-blue-pingfederate-admin:"9999"..." && wait-for pf-blue-pingfederate-admin:"9999"
          -t 300 -- echo "pf-blue-pingfederate-admin:"9999" running"
        image: pingidentity/pingtoolkit:2609
        imagePullPolicy: IfNotPresent
        name: wait-for-pingfederate-admin
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 1m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 9031
          seccompProfile:
            type: RuntimeDefault
      - args:
        - umask 077; for source in /run/projected/*; do cp -RL "$source" /run/ping-secrets/;
          done; find /run/ping-secrets -mindepth 1 -type f -exec chmod 600 {} +; find
          /run/ping-secrets -mindepth 1 -type d -exec chmod 700 {} +
        command:
        - sh
        - -ec
        image: pingidentity/pingtoolkit:2609
        name: copy-federate-secrets
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 9031
        volumeMounts:
        - mountPath: /run/projected
          name: pf-projected
          readOnly: true
        - mountPath: /run/ping-secrets
          name: pf-secrets
      - args:
        - "#!/usr/bin/env sh\nset -eu\nhost=${PROXY_HOST:-pd-pingdirectoryproxy.identity-proxy.svc.cluster.local}\n\
          port=${PROXY_PORT:-636}\nca=${PROXY_CA_FILE:-/run/ping-secrets/ca.crt}\n\
          attempts=${PROXY_WAIT_ATTEMPTS:-60}\ndelay=${PROXY_WAIT_INTERVAL_SECONDS:-5}\n\
          connect_timeout=${PROXY_CONNECT_TIMEOUT_SECONDS:-10}\ncommand -v openssl\
          \ >/dev/null\ncommand -v timeout >/dev/null\ntest -s \"$ca\"\nattempt=1\n\
          while test \"$attempt\" -le \"$attempts\"; do\n    # The Service routes\
          \ to ready proxy endpoints. Verify its TLS identity;\n    # merely opening\
          \ a TCP socket would also accept an untrusted server.\n    if timeout \"\
          $connect_timeout\" openssl s_client -brief \\\n        -connect \"${host}:${port}\"\
          \ -servername \"$host\" \\\n        -verify_hostname \"$host\" -verify_return_error\
          \ -CAfile \"$ca\" \\\n        </dev/null >/dev/null 2>&1; then\n       \
          \ echo \"Directory Proxy LDAPS endpoint is reachable with trusted TLS\"\n\
          \        exit 0\n    fi\n    echo \"Waiting for Directory Proxy LDAPS (${attempt}/${attempts})\"\
          \n    if test \"$attempt\" -lt \"$attempts\"; then sleep \"$delay\"; fi\n\
          \    attempt=$((attempt + 1))\ndone\necho 'Directory Proxy did not become\
          \ reachable with trusted TLS; blocking PF startup' >&2\nexit 1\n"
        command:
        - sh
        - -ec
        image: pingidentity/pingtoolkit:2609
        name: wait-for-directory-proxy
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 9031
        volumeMounts:
        - mountPath: /run/ping-secrets
          name: pf-secrets
          readOnly: true
      nodeSelector: {}
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 9031
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 120
      tolerations: []
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: pf-blue
            app.kubernetes.io/name: pingfederate-engine
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: pf-blue
            app.kubernetes.io/name: pingfederate-engine
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - name: pf-projected
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          - key: PingFederate.lic
            path: PingFederate.lic
          - key: pf.jwk
            path: pf.jwk
          - key: var.dataStores_items_LDAP_D803C87FAB2ADFB4B0A947B64BA6F0C6093A5CA3_LDAP_D803C87FAB2ADFB4B0A947B64BA6F0C6093A5CA3_password
            path: vars/dataStores_items_LDAP_D803C87FAB2ADFB4B0A947B64BA6F0C6093A5CA3_LDAP_D803C87FAB2ADFB4B0A947B64BA6F0C6093A5CA3_password
          - key: var.PRIVATE_KEYSTORE
            path: vars/PRIVATE_KEYSTORE
          - key: var.PRIVATE_KEYSTORE_PIN
            path: vars/PRIVATE_KEYSTORE_PIN
          - key: var.passwordCredentialValidators_items_simple_configuration_tables_rows_fields_Password_value
            path: vars/passwordCredentialValidators_items_simple_configuration_tables_rows_fields_Password_value
          - key: var.certificates_ca_items_50z1hm968rdu2irr31i5ridbh_50z1hm968rdu2irr31i5ridbh_fileData
            path: vars/certificates_ca_items_50z1hm968rdu2irr31i5ridbh_50z1hm968rdu2irr31i5ridbh_fileData
          - key: var.keyPairs_signing_items_devsigningcert_devsigningcert_fileData
            path: vars/keyPairs_signing_items_devsigningcert_devsigningcert_fileData
          - key: var.keyPairs_signing_items_devsigningcert_devsigningcert_password
            path: vars/keyPairs_signing_items_devsigningcert_devsigningcert_password
          - key: var.serverSettings_systemKeys_items_current_keyData
            path: vars/serverSettings_systemKeys_items_current_keyData
          - key: var.serverSettings_systemKeys_items_pending_keyData
            path: vars/serverSettings_systemKeys_items_pending_keyData
          - key: var.sp_idpConnections_items_aLGfLX1_K4VP6a3uGh33YOuZodG_credentials_certs_x509File_a5kvb66kyxbmdfwp506gijvn6_a5kvb66kyxbmdfwp506gijvn6_fileData
            path: vars/sp_idpConnections_items_aLGfLX1_K4VP6a3uGh33YOuZodG_credentials_certs_x509File_a5kvb66kyxbmdfwp506gijvn6_a5kvb66kyxbmdfwp506gijvn6_fileData
          - key: var.dataStores_items_ProvisionerDS_ProvisionerDS_password
            path: vars/dataStores_items_ProvisionerDS_ProvisionerDS_password
          - key: var.passwordCredentialValidators_items_simple_configuration_tables_rows_fields_Confirm_Password_value
            path: vars/passwordCredentialValidators_items_simple_configuration_tables_rows_fields_Confirm_Password_value
          - key: var.administrativeAccounts_items_Administrator_password
            path: vars/administrativeAccounts_items_Administrator_password
          - key: var.PING_IDENTITY_PASSWORD
            path: vars/PING_IDENTITY_PASSWORD
          - key: var.PF_CLUSTER_PASSWORD
