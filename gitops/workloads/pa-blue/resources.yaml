apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: null
  labels:
    app.kubernetes.io/instance: pa-blue
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pingaccess-engine
    helm.sh/chart: ping-devops-0.16.0
  name: pa-blue-pingaccess-engine
  namespace: identity-access-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: pa-blue
      app.kubernetes.io/name: pingaccess-engine
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: 6466bf011065a6e2408799bcc13cb720dfc4108b5cb033218d0ff7a6fb254333
      labels:
        app.kubernetes.io/instance: pa-blue
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: pingaccess-engine
        helm.sh/chart: ping-devops-0.16.0
    spec:
      affinity: {}
      containers:
      - args: null
        envFrom:
        - configMapRef:
            name: pa-blue-global-env-vars
            optional: true
        - configMapRef:
            name: pa-blue-env-vars
            optional: true
        - configMapRef:
            name: pa-blue-pingaccess-engine-env-vars
        - secretRef:
            name: devops-secret
            optional: true
        - secretRef:
            name: pa-blue-pingaccess-engine-git-secret
            optional: true
        image: 447061058131.dkr.ecr.ap-southeast-2.amazonaws.com/pd-spot-dev/pingaccess:pa-v1
        imagePullPolicy: IfNotPresent
        lifecycle: {}
        livenessProbe:
          exec:
            command:
            - /opt/liveness.sh
          failureThreshold: 4
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: pingaccess-engine
        ports:
        - containerPort: 3000
          name: https
        readinessProbe:
          exec:
            command:
            - /opt/readiness.sh
          failureThreshold: 4
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - /opt/liveness.sh
          failureThreshold: 90
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /run/ping-secrets
          name: pa-secrets
          readOnly: true
      enableServiceLinks: true
      initContainers:
      - command:
        - sh
        - -c
        - echo "Waiting for pa-blue-pingaccess-admin:"9000"..." && wait-for pa-blue-pingaccess-admin:"9000"
          -t 300 -- echo "pa-blue-pingaccess-admin:"9000" running"
        image: pingidentity/pingtoolkit:2609
        imagePullPolicy: IfNotPresent
        name: wait-for-pingaccess-admin
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 1m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 9031
          seccompProfile:
            type: RuntimeDefault
      - args:
        - umask 077; for source in /run/projected/*; do cp -RL "$source" /run/ping-secrets/;
          done; find /run/ping-secrets -mindepth 1 -type f -exec chmod 600 {} +; find
          /run/ping-secrets -mindepth 1 -type d -exec chmod 700 {} +
        command:
        - sh
        - -ec
        image: pingidentity/pingtoolkit:2609
        name: copy-access-secrets
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 9031
        volumeMounts:
        - mountPath: /run/projected
          name: pa-projected
          readOnly: true
        - mountPath: /run/ping-secrets
          name: pa-secrets
      nodeSelector: {}
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 9031
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 120
      tolerations: []
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: pa-blue
            app.kubernetes.io/name: pingaccess-engine
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: pa-blue
            app.kubernetes.io/name: pingaccess-engine
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - name: pa-projected
        secret:
          items:
          - key: admin-password
            path: admin-password
          - key: PingAccess.lic
            path: pingaccess.lic
          - key: ca.crt
            path: ca.crt
          secretName: pa-blue-runtime
      - emptyDir:
          medium: Memory
        name: pa-secrets
