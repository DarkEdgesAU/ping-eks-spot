[SERVICE]
    Flush 2
    Log_Level info
    Parsers_File /fluent-bit/etc/poc/parsers.conf
    storage.path /buffers/chunks
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020

[INPUT]
    Name tail
    Path ${LOG_PATHS}
    Exclude_Path *.gz,*.zip,*.lock,*.lck
    Tag ping.files
    Path_Key source_file
    DB /buffers/tail.db
    Read_from_Head On
    Refresh_Interval 2
    Rotate_Wait 10
    Buffer_Max_Size 1M
    Skip_Long_Lines On
    storage.type filesystem

[FILTER]
    Name modify
    Match *
    Add namespace ${POD_NAMESPACE}
    Add pod ${POD_NAME}
    Add product ${PRODUCT}
    Add colour ${COLOUR}
    Add stream product_file

[OUTPUT]
    Name opensearch
    Match *
    Host opensearch.logging.svc.cluster.local
    Port 9200
    HTTP_User logshipper
    HTTP_Passwd ${LOG_PASSWORD}
    tls On
    tls.verify On
    tls.verify_hostname On
    tls.ca_file /credentials/ca.crt
    Logstash_Format On
    Logstash_Prefix logs-ping
    Suppress_Type_Name On
    Generate_ID On
    Retry_Limit False
    storage.total_limit_size 128M
